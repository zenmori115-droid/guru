<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaporKu Guru — Generator Laporan untuk Wali Murid</title>
    <meta
      name="description"
      content="Generator pesan laporan perkembangan siswa berbasis AI untuk dikirim ke WhatsApp wali murid. Pesan jujur, tetap sopan."
    />
    <meta property="og:title" content="LaporKu Guru — Generator Laporan untuk Wali Murid" />
    <meta
      property="og:description"
      content="Bantu guru menyusun pesan laporan perkembangan siswa yang jujur, sopan, dan siap kirim ke WhatsApp wali murid."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('laporku_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#FF8A1F]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
